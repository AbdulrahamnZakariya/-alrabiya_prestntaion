<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F2EEE6}

.strip{position:absolute;direction:rtl;text-align:center;color:#161412;font-family:Lz}
.s1{top:300px;left:150px;width:780px;padding:18px 0 4px;background:#FFFFFF;font-size:170px;line-height:1.15;transform:rotate(-3deg);box-shadow:0 14px 30px rgba(22,20,18,.22);

.s2 b{font-weight:400;color:#FFCF1F}

.stamp::after{content:"";position:absolute;inset:6px;border:3px solid #D6262B;border-radius:6px}
.foot{position:absolute;left:-30px;top:1600px;width:1140px;height:360px;background:#161412;transform:rotate(-2deg);clip-path:polygon(0 8%,7% 3%,15% 9%,26% 2%,38% 8%,50% 1%,62% 7%,74% 2%,86% 8%,100% 3%,100% 100%,0 100%);box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.logo{position:absolute;left:50%;top:1720px;transform:translateX(-50%) rotate(-2deg);display:flex;align-items:center;gap:16px;background:#161412;border:8px solid #fff;border-radius:999px;padding:12px 34px 16px;direction:rtl;box-shadow:0 12px 26px rgba(22,20,18,.3)}
.logo span{font:700 48px/1 Rx;color:#F2EEE6}
.logo svg{width:60px;height:60px}
.arrow{position:absolute;top:840px;left:770px;width:190px;height:170px}

    <span>تقني واعي</span>
  </div>
</div>
</body></html>
