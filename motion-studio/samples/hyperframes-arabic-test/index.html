<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP vendored locally (no network at render time) -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "IBM Plex Sans Arabic";
        src: url("assets/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans Arabic";
        src: url("assets/fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1020;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "IBM Plex Sans Arabic", sans-serif;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
        padding: 0 90px;
      }
      #accent {
        width: 180px;
        height: 12px;
        border-radius: 6px;
        background: #f5b82e;
        transform-origin: right center;
      }
      #headline {
        color: #ffffff;
        font-size: 124px;
        font-weight: 700;
        line-height: 1.35;
        text-align: center;
        direction: rtl; /* scoped to text, NOT on <html> */
      }
      /* One span per WORD — never per letter (keeps Arabic shaping intact) */
      #headline .w {
        display: inline-block;
        white-space: nowrap;
      }
      #sub {
        color: #aab4d4;
        font-size: 56px;
        font-weight: 500;
        text-align: center;
        direction: rtl;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div id="scene1" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="accent"></div>
        <h1 id="headline">
          <span class="w">الذكاء</span> <span class="w">الاصطناعي</span> <span class="w">يصنع</span> <span class="w">المونتاج</span>
        </h1>
        <p id="sub">اختبار HyperFrames</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#accent", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      // Word-by-word reveal (stagger is deterministic: fixed offsets on the timeline)
      tl.fromTo(
        "#headline .w",
        { opacity: 0, y: 60 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.22 },
        0.2
      );
      tl.fromTo("#sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.4);
      tl.to("#headline .w", { scale: 1.04, duration: 0.6, ease: "sine.inOut", stagger: 0.05 }, 2.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
